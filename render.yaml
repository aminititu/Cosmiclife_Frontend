
services:
  - type: web
    runtime: static
    name: cosmic-life
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist

    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: VITE_API_BASE_URL
        value: https://cosmiclife-production.up.railway.app
      - key: VITE_MARKET
        value: IN

    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /images/*
        name: Cache-Control
        value: public, max-age=604800

    routes:
      - type: rewrite
        source: /api/*
        destination: https://cosmiclife-production.up.railway.app/api/*
      - type: rewrite
        source: /*
        destination: /index.html
